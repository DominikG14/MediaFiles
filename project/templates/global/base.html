{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Template Django Project{% endblock title %}</title>
  
  <link rel="stylesheet" href="{% static 'global/styles/reset.css' %}">
  <link rel="stylesheet" href="{% static 'global/styles/base.css' %}">

  <link rel="stylesheet" href="{% static 'global/styles/components/header.css' %}">
  <link rel="stylesheet" href="{% static 'global/styles/components/side-nav.css' %}">

  {% block base_static %}
  {% endblock base_static %}
</head>
<body>
  {% include 'global/components/header.html' %}
  {% include 'global/components/side-nav.html' %}

  <main class="main">
    {% block base_content %}
    {% endblock base_content %}
  </main>
</body>
</html>
